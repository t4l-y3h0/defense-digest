<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <title>The Defense Brief — Continuous Intelligence Timeline</title>

  <!-- Google Fonts: Hebrew (Rubik) & Editorial English (Newsreader) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Neo-Editorial Theme Tokens */
      --bg: #f9f9fb;
      --card: #ffffff;
      --card-sec: #f3f4f7;
      --card-highlight: rgba(0, 102, 204, 0.04);
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.05);
      --border-accent: #0066cc;
      --text: #18191c;
      --text-sec: #565961;
      --text-ter: #8a8d98;
      --accent: #0066cc;
      --accent-rgb: 0, 102, 204;
      --red: #d32f2f;
      --amber: #d97706;
      --green: #10b981;
      --capsule-bg: rgba(26, 28, 33, 0.9);
      --capsule-text: #ffffff;
      --capsule-border: rgba(255, 255, 255, 0.18);
      --radius: 18px;
      --radius-sm: 10px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 8px 30px rgba(0, 0, 0, 0.08);

      /* Typography Stacks */
      --font-serif: "Newsreader", Georgia, Cambria, serif;
      --font-sans: "Segoe UI", "Rubik", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Assistant", sans-serif;
      --font-hebrew: "Segoe UI", "Rubik", "Segoe UI Variable", "Assistant", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0c10;
        --card: #14161f;
        --card-sec: #1c1f2b;
        --card-highlight: rgba(0, 102, 204, 0.12);
        --border: rgba(255, 255, 255, 0.1);
        --border-subtle: rgba(255, 255, 255, 0.06);
        --border-accent: #3b82f6;
        --text: #f0f1f5;
        --text-sec: #9fa3b0;
        --text-ter: #686c78;
        --accent: #3b82f6;
        --accent-rgb: 59, 130, 246;
        --red: #ef4444;
        --amber: #f59e0b;
        --green: #10b981;
        --capsule-bg: rgba(18, 20, 26, 0.94);
        --capsule-text: #ffffff;
        --capsule-border: rgba(255, 255, 255, 0.16);
        --shadow: 0 4px 22px rgba(0, 0, 0, 0.45);
        --shadow-hover: 0 8px 34px rgba(0, 0, 0, 0.6);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overflow-x: clip; scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: var(--font-hebrew);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.55;
      overflow-wrap: break-word;
      padding-block-end: calc(90px + max(1rem, env(safe-area-inset-bottom, 0px)));
      padding-inline-start: env(safe-area-inset-left, 0px);
      padding-inline-end: env(safe-area-inset-right, 0px);
    }

    html[lang="en"] body,
    html[dir="ltr"] body {
      font-family: var(--font-sans);
    }

    :where(a, code) { overflow-wrap: anywhere; word-break: break-word; }

    /* Grand Editorial Masthead */
    header.editorial-masthead {
      padding-top: max(1.25rem, env(safe-area-inset-top, 0px));
      padding-inline: 1.25rem;
      padding-bottom: 0.85rem;
      max-inline-size: 1120px;
      margin-inline: auto;
      text-align: center;
      border-block-end: 2px solid var(--border);
    }

    .masthead-top-line {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-sec);
      padding-bottom: 0.45rem;
      border-block-end: 1px solid var(--border-subtle);
      margin-bottom: 0.85rem;
      line-height: 1.25;
    }

    .meta-tag { white-space: nowrap; }
    .meta-tag.live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--green);
      font-weight: 800;
    }

    .meta-dot {
      color: var(--accent);
      opacity: 0.65;
      font-size: 0.65rem;
      user-select: none;
    }

    .masthead-title {
      font-family: var(--font-hebrew);
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem 0;
      line-height: 1.18;
    }

    html[lang="en"] .masthead-title {
      font-family: var(--font-serif);
      font-size: 2.3rem;
      letter-spacing: -0.025em;
    }

    .masthead-tagline {
      font-size: 0.9rem;
      color: var(--text-sec);
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    /* Underline Domain Tabs */
    .editorial-tabs {
      display: flex;
      justify-content: center;
      gap: 1.15rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-block-start: 0.25rem;
    }
    .editorial-tabs::-webkit-scrollbar { display: none; }

    .tab-item {
      background: none;
      border: none;
      border-block-end: 3px solid transparent;
      padding: 0.4rem 0.25rem 0.6rem 0.25rem;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-sec);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .tab-item.active {
      color: var(--text);
      border-block-end-color: var(--text);
    }

    /* Main Container */
    main.editorial-main {
      max-inline-size: 1120px;
      margin-inline: auto;
      padding: 1.25rem 1rem;
    }

    /* Live Stream Header Ticker */
    .live-stream-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1.1rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow);
    }

    .live-badge-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot-pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--green);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulseGreen 2s infinite;
      flex-shrink: 0;
    }

    @keyframes pulseGreen {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .live-title-text {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--green);
    }

    .live-meta-desc {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sec);
      flex: 1;
      min-width: 200px;
    }

    .live-meta-desc strong {
      color: var(--text);
    }

    .live-refresh-action {
      background: var(--card-sec);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .live-refresh-action:hover, .live-refresh-action:active {
      background: var(--card-highlight);
      border-color: var(--accent);
    }

    /* Top Carousel */
    .carousel-section { margin-block-end: 2rem; }
    .section-label {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--red);
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .section-heading { font-size: 1.45rem; font-weight: 900; margin: 0 0 1rem 0; letter-spacing: -0.02em; }

    .carousel-track {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-block: 4px;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 88%;
      max-inline-size: 420px;
      scroll-snap-align: center;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .carousel-slide:active { transform: scale(0.985); }

    .carousel-img-wrap { inline-size: 100%; aspect-ratio: 16 / 9; background: var(--card-sec); position: relative; }
    .carousel-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .carousel-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--red);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    html[dir="ltr"] .carousel-badge { right: auto; left: 10px; }

    .carousel-content { padding: 1rem; flex: 1; display: flex; flex-direction: column; }
    .carousel-meta { font-size: 0.72rem; font-weight: 700; color: var(--text-sec); text-transform: uppercase; margin-bottom: 0.35rem; display: flex; align-items: center; justify-content: space-between; }
    .carousel-title { margin: 0 0 0.45rem 0; font-size: 1.08rem; font-weight: 800; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .carousel-desc { font-size: 0.85rem; color: var(--text-sec); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Timeline Edition Dividers */
    .timeline-edition-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-block: 2.5rem 1.4rem;
      position: relative;
    }
    .timeline-edition-divider:first-of-type {
      margin-block-start: 1rem;
    }
    .timeline-divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .timeline-edition-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 7px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      box-shadow: var(--shadow);
      white-space: nowrap;
    }
    .timeline-edition-tag {
      color: var(--accent);
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .timeline-edition-time {
      font-size: 0.78rem;
      color: var(--text-sec);
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
    .timeline-edition-count {
      background: var(--card-sec);
      color: var(--text-sec);
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 800;
    }

    /* Feed Grid / Cards */
    .feed-grid { display: flex; flex-direction: column; gap: 1.4rem; }
    .story-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 1.25rem;
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      position: relative;
    }
    .story-card:hover { box-shadow: var(--shadow-hover); }
    .story-card.high-priority { border-inline-start: 5px solid var(--red); }

    .story-top-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-block-end: 0.75rem; flex-wrap: wrap; }
    .meta-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .mini-badge {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--card-sec);
      color: var(--text-sec);
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mini-badge.priority-high { background: rgba(211, 47, 47, 0.12); color: var(--red); font-weight: 800; }
    .mini-badge.domain { background: rgba(var(--accent-rgb), 0.1); color: var(--accent); }
    
    /* Dedicated Per-Item Date and Time Badge */
    .mini-badge.timestamp-badge {
      background: rgba(var(--accent-rgb), 0.08);
      color: var(--accent);
      border: 1px solid rgba(var(--accent-rgb), 0.22);
      font-weight: 700;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }
    html[dir="rtl"] .mini-badge.timestamp-badge {
      direction: rtl;
    }
    .time-icon { font-size: 0.75rem; opacity: 0.9; }

    .story-share-btn {
      background: var(--card-sec);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .story-share-btn:hover { background: var(--card-highlight); }
    .story-share-btn.copied {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .story-card.highlight-target {
      animation: targetPulse 2.5s ease-out;
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    @keyframes targetPulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 113, 227, 0.7); }
      50% { box-shadow: 0 0 20px 4px rgba(0, 113, 227, 0.4); }
      100% { box-shadow: 0 0 0 0 rgba(0, 113, 227, 0); }
    }

    .story-title { margin: 0 0 0.85rem 0; font-size: 1.25rem; font-weight: 800; line-height: 1.35; letter-spacing: -0.015em; }
    .story-media-box { margin-block-end: 0.95rem; border-radius: var(--radius-sm); overflow: hidden; background: var(--card-sec); border: 1px solid var(--border-subtle); }
    .story-media-box img { inline-size: 100%; aspect-ratio: 16 / 9; max-block-size: 290px; object-fit: cover; display: block; }
    .media-caption { padding: 0.45rem 0.75rem; font-size: 0.75rem; color: var(--text-ter); display: flex; justify-content: space-between; align-items: center; border-block-start: 1px solid var(--border-subtle); }
    .media-caption a { color: var(--accent); text-decoration: none; font-weight: 600; }

    .story-lead { font-size: 0.98rem; line-height: 1.6; margin: 0 0 0.95rem 0; color: var(--text); }

    /* Pull-Quote Specs & Strategic Implications */
    .specs-disclosure { margin-block: 0.95rem; border-radius: var(--radius-sm); background: var(--card-sec); border: 1px solid var(--border-subtle); overflow: hidden; }
    .specs-summary { padding: 0.7rem 0.9rem; font-size: 0.84rem; font-weight: 800; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; color: var(--accent); }
    .specs-summary::-webkit-details-marker { display: none; }
    .specs-chevron { transition: transform 0.2s ease; font-size: 0.72rem; }
    details[open] .specs-chevron { transform: rotate(180deg); }
    
    .specs-body { padding: 0.9rem; border-block-start: 1px solid var(--border-subtle); font-size: 0.88rem; line-height: 1.5; }
    .spec-block { margin-block-end: 0.65rem; }
    .spec-block:last-child { margin-block-end: 0; }
    .spec-label { font-weight: 800; color: var(--text); display: block; margin-bottom: 2px; }

    .israel-box {
      margin-top: 0.65rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      background: var(--card-highlight);
      border-inline-start: 3px solid var(--accent);
    }

    .story-sources { margin-block-start: 0.95rem; padding-block-start: 0.65rem; border-block-start: 1px solid var(--border-subtle); font-size: 0.8rem; color: var(--text-sec); }
    .story-sources a { color: var(--accent); text-decoration: none; font-weight: 700; }

    /* Sentinel & Continuous Loader */
    #feed-scroll-sentinel {
      width: 100%;
      height: 20px;
      margin-block: 1rem;
    }

    .feed-loader-box {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-sec);
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .feed-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .archive-end-banner {
      text-align: center;
      padding: 2.5rem 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-sec);
      margin-block: 2rem;
    }
    .archive-end-banner h4 { margin: 0 0 0.5rem 0; color: var(--text); font-size: 1.1rem; }
    .archive-end-banner p { margin: 0 0 1rem 0; font-size: 0.88rem; }

    /* Active Filter Banner */
    .active-filter-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(var(--accent-rgb), 0.08);
      border: 1px solid var(--border-accent);
      border-radius: 12px;
      padding: 9px 14px;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
      font-weight: 600;
      gap: 10px;
    }
    .clear-filter-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }

    /* Floating Capsule & Action Toast */
    .floating-capsule {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom, 0px) + 8px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      background: var(--capsule-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: var(--capsule-text);
      border: 1px solid var(--capsule-border);
      border-radius: 35px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      font-family: inherit;
      max-width: calc(100vw - 20px);
      box-sizing: border-box;
    }

    .capsule-btn {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 18px;
      touch-action: manipulation;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .capsule-btn:active { background: rgba(255, 255, 255, 0.2); }
    .capsule-btn.active-filter {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(0, 102, 204, 0.6);
    }

    .capsule-divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    /* Floating Scroll-to-Top Button */
    .floating-top-btn {
      position: fixed;
      bottom: max(80px, env(safe-area-inset-bottom, 0px) + 70px);
      left: 20px;
      z-index: 850;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 18px rgba(0,0,0,0.2);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }
    html[dir="rtl"] .floating-top-btn {
      left: auto;
      right: 20px;
    }
    .floating-top-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    /* Bottom Sheets */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }

    .bottom-sheet {
      background: var(--card);
      border-radius: 22px 22px 0 0;
      border: 1px solid var(--border);
      width: 100%;
      max-inline-size: 650px;
      max-block-size: 82vh;
      overflow-y: auto;
      padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px)) 1.25rem;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .sheet-grabber { width: 38px; height: 4px; border-radius: 2px; background: var(--text-ter); margin: 0 auto 1rem auto; }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .sheet-title { font-size: 1.25rem; font-weight: 800; margin: 0; }
    .sheet-close-btn { background: var(--card-sec); border: none; color: var(--text); font-weight: 700; padding: 6px 14px; border-radius: 12px; cursor: pointer; }

    .bluf-sheet-list { margin: 0; padding-inline-start: 1.25rem; }
    .bluf-sheet-list li { margin-block-end: 0.75rem; font-size: 0.95rem; line-height: 1.55; }

    /* Country Sheet */
    .country-search-wrap { margin-bottom: 0.85rem; }
    .country-search-field {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-sec);
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .country-search-field:focus { border-color: var(--accent); }
    .country-sheet-grid { display: flex; flex-direction: column; gap: 0.5rem; max-height: 55vh; overflow-y: auto; }
    .country-group-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-ter); margin-top: 0.65rem; margin-bottom: 0.35rem; }
    .country-chips-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.5rem; }
    .country-btn {
      background: var(--card-sec);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      text-align: start;
    }
    .country-btn:active, .country-btn:hover { background: var(--card-highlight); border-color: var(--accent); }
    .country-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    .country-btn .c-count { background: rgba(0, 0, 0, 0.08); font-size: 0.75rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
    .country-btn.active .c-count { background: rgba(255, 255, 255, 0.25); color: var(--bg); }
    @media (prefers-color-scheme: dark) {
      .country-btn .c-count { background: rgba(255, 255, 255, 0.12); }
    }

    /* Date Sheet */
    .date-sheet-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; padding-block: 4px; }
    .date-jump-btn {
      background: var(--card-sec);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .date-jump-btn:hover, .date-jump-btn:active { background: var(--card-highlight); border-color: var(--accent); }
    .date-jump-btn.all-dates-btn {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      margin-bottom: 6px;
    }
    .date-jump-btn.active { border-color: var(--accent); background: var(--card-highlight); }

    #capsule-toast {
      position: fixed;
      bottom: calc(75px + max(1rem, env(safe-area-inset-bottom, 0px)));
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(26, 28, 33, 0.92);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      z-index: 9999;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    #capsule-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <!-- Grand Editorial Masthead -->
  <header class="editorial-masthead">
    <div class="masthead-top-line">
      <span class="meta-tag">UNCLASSIFIED / OSINT</span>
      <span class="meta-dot">•</span>
      <span class="meta-tag live-indicator">
        <span class="live-dot-pulse"></span>
        <span id="ui-meta-live">LIVE CONTINUOUS FEED</span>
      </span>
      <span class="meta-dot">•</span>
      <span class="meta-tag" id="ui-meta-date">NOVEMBER 21, 2026</span>
    </div>
    <h1 class="masthead-title" id="ui-brand-title">סקירת טכנולוגיות ביטחוניות</h1>
    <div class="masthead-tagline" id="ui-brand-sub">פיד מודיעין רציף · אמצעי לחימה, רכש ומשמעויות אסטרטגיות לפי ציר הזמן</div>

    <nav class="editorial-tabs" aria-label="Domain Tabs">
      <button type="button" class="tab-item active" data-domain="all"><span id="tab-all-lbl">כל הדיווחים</span></button>
      <button type="button" class="tab-item" data-domain="air"><span id="tab-air-lbl">הגנה אווירית</span></button>
      <button type="button" class="tab-item" data-domain="aerial"><span id="tab-aerial-lbl">אווירי</span></button>
      <button type="button" class="tab-item" data-domain="strike"><span id="tab-strike-lbl">תקיפה</span></button>
      <button type="button" class="tab-item" data-domain="naval"><span id="tab-naval-lbl">ימי</span></button>
    </nav>
  </header>

  <main class="editorial-main" id="app-main"></main>

  <!-- Floating Scroll-to-Top Button -->
  <button type="button" class="floating-top-btn" id="btn-scroll-top" title="למעלה / Top" aria-label="Scroll to top">
    ↑
  </button>

  <!-- Floating Dynamic Island Capsule -->
  <aside class="floating-capsule" role="navigation" aria-label="Quick Navigation">
    <button type="button" class="capsule-btn" id="cap-lang" title="Toggle Language">🌐 <span id="cap-lang-text">EN</span></button>
    <div class="capsule-divider"></div>
    <button type="button" class="capsule-btn" id="cap-date" title="Select Edition or Date">📅 <span id="cap-date-text">ציר זמן</span></button>
    <div class="capsule-divider"></div>
    <button type="button" class="capsule-btn" id="cap-country" title="Filter by Country">🌍 <span id="cap-country-text">מדינה</span></button>
    <div class="capsule-divider"></div>
    <button type="button" class="capsule-btn" id="cap-bluf" title="View Executive BLUF">⚡ BLUF</button>
  </aside>

  <!-- BLUF Bottom Sheet -->
  <div class="sheet-backdrop" id="bluf-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title" id="sheet-bluf-title">תקציר מנהלים (BLUF)</h2>
        <button type="button" class="sheet-close-btn" id="close-bluf-sheet">סגור</button>
      </div>
      <div id="bluf-edition-selector" style="margin-bottom:12px;font-size:0.85rem;color:var(--text-sec);font-weight:700;"></div>
      <ul class="bluf-sheet-list" id="bluf-sheet-content"></ul>
    </div>
  </div>

  <!-- Date / Timeline Jump Bottom Sheet -->
  <div class="sheet-backdrop" id="date-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title" id="sheet-date-title">ציר זמן ומהדורות</h2>
        <button type="button" class="sheet-close-btn" id="close-date-sheet">סגור</button>
      </div>
      <div class="date-sheet-list" id="date-list-buttons"></div>
    </div>
  </div>

  <!-- Country Bottom Sheet -->
  <div class="sheet-backdrop" id="country-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title" id="sheet-country-title">סינון לפי מדינה</h2>
        <button type="button" class="sheet-close-btn" id="close-country-sheet">סגור</button>
      </div>
      <div class="country-search-wrap">
        <input type="search" id="country-search-input" class="country-search-field" placeholder="חיפוש מדינה..." autocomplete="off" />
      </div>
      <div id="country-sheet-content" class="country-sheet-grid"></div>
    </div>
  </div>

  <div id="capsule-toast" role="status" aria-live="polite"></div>

  <script src="./feed_bundle.js"></script>
  <script>
    (function () {
      const feed = window.DEFENSE_BRIEF_FEED || { dates: [], digests: {}, updated_at: "" };
      const urlParams = new URLSearchParams(window.location.search);
      
      let initialLang = "he";
      if (urlParams.get("lang") === "he" || urlParams.get("lang") === "en") {
        initialLang = urlParams.get("lang");
      } else {
        try {
          const saved = localStorage.getItem("defense_brief_lang");
          if (saved === "he" || saved === "en") initialLang = saved;
        } catch (e) {}
      }

      // If user provided a specific date in URL params, isolate or scroll to it
      let initialDateFilter = urlParams.get("date") || null;
      if (initialDateFilter === "all" || !feed.digests[initialDateFilter]) {
        initialDateFilter = null;
      }

      let state = {
        lang: initialLang,
        domain: urlParams.get("domain") || "all",
        country: urlParams.get("country") || null,
        dateFilter: initialDateFilter, // null means FULL CONTINUOUS TIMELINE
        renderedCount: 25 // incremental batch rendering
      };

      const BATCH_SIZE = 25;

      const FLAG_MAP = {
        "israel": "🇮🇱", "ישראל": "🇮🇱",
        "germany": "🇩🇪", "גרמניה": "🇩🇪",
        "united states": "🇺🇸", "ארצות הברית": "🇺🇸", "ארה\"ב": "🇺🇸", "usa": "🇺🇸", "us": "🇺🇸",
        "india": "🇮🇳", "הודו": "🇮🇳",
        "uae": "🇦🇪", "איחוד האמירויות": "🇦🇪",
        "azerbaijan": "🇦🇿", "אזרבייג'ן": "🇦🇿",
        "singapore": "🇸🇬", "סינגפור": "🇸🇬",
        "morocco": "🇲🇦", "מרוקו": "🇲🇦",
        "south korea": "🇰🇷", "דרום קוריאה": "🇰🇷",
        "france": "🇫🇷", "צרפת": "🇫🇷",
        "ukraine": "🇺🇦", "אוקראינה": "🇺🇦",
        "russia": "🇷🇺", "רוסיה": "🇷🇺",
        "china": "🇨🇳", "סין": "🇨🇳",
        "iran": "🇮🇷", "איראן": "🇮🇷",
        "poland": "🇵🇱", "פולין": "🇵🇱",
        "united kingdom": "🇬🇧", "בריטניה": "🇬🇧", "uk": "🇬🇧",
        "nato": "🇪🇺", "נאט\"ו": "🇪🇺",
        "europe": "🇪🇺", "אירופה": "🇪🇺",
        "czech republic": "🇨🇿", "צ'כיה": "🇨🇿",
        "switzerland": "🇨🇭", "שווייץ": "🇨🇭",
        "kuwait": "🇰🇼", "כווית": "כווית",
        "bahrain": "🇧🇭", "בחריין": "בחריין",
        "austria": "🇦🇹", "אוסטריה": "🇦🇹",
        "malaysia": "🇲🇾", "מלזיה": "מלזיה",
        "ghana": "🇬🇭", "גאנה": "גאנה",
        "spain": "🇪🇸", "ספרד": "🇪🇸",
        "canada": "🇨🇦", "קנדה": "קנדה",
        "pakistan": "🇵🇰", "פקיסטן": "פקיסטן",
        "italy": "🇮🇹", "איטליה": "איטליה",
        "finland": "🇫🇮", "פינלנד": "פינלנד",
        "albania": "🇦🇱", "אלבניה": "אלבניה",
        "saudi arabia": "🇸🇦", "ערב הסעודית": "ערב הסעודית",
        "yemen": "🇾🇪", "תימן": "תימן",
        "estonia": "🇪🇪", "אסטוניה": "אסטוניה",
        "ireland": "🇮🇪", "אירלנד": "אירלנד",
        "oman": "🇴🇲", "עומאן": "עומאן",
        "taiwan": "🇹🇼", "טייוואן": "טייוואן",
        "turkey": "🇹🇷", "טורקיה": "טורקיה",
        "japan": "🇯🇵", "יפן": "יפן"
      };

      // Ensure dates are sorted chronologically descending (evening before main of same date)
      function getEditionSortTime(key) {
        const dig = feed.digests[key];
        if (dig && dig.wend) {
          const t = new Date(dig.wend).getTime();
          if (!isNaN(t)) return t;
        }
        const base = key.replace("-evening", "");
        const isEv = key.includes("evening");
        const timePart = isEv ? "T18:50:00Z" : "T15:20:00Z";
        return new Date(base + timePart).getTime() || 0;
      }

      const sortedDates = (feed.dates || []).slice().sort((a, b) => getEditionSortTime(b) - getEditionSortTime(a));

      // Build unified continuous timeline items
      const globalTimeline = [];
      const editionsMeta = {};

      sortedDates.forEach((dateKey) => {
        const dig = feed.digests[dateKey];
        if (!dig) return;
        const isEvening = dateKey.includes("evening");
        const baseDate = dateKey.replace("-evening", "");
        const wendTimeMs = getEditionSortTime(dateKey);
        const wendIso = dig.wend || new Date(wendTimeMs).toISOString();

        editionsMeta[dateKey] = {
          key: dateKey,
          baseDate: baseDate,
          isEvening: isEvening,
          wend: wendIso,
          wendTimeMs: wendTimeMs,
          itemCount: (dig.items || []).length,
          bluf: dig.digest?.bluf || {},
          photos: dig.photos || {}
        };

        (dig.items || []).forEach((it, idx) => {
          globalTimeline.push({
            ...it,
            _uid: `${dateKey}__${it.id}`,
            _editionKey: dateKey,
            _baseDate: baseDate,
            _isEvening: isEvening,
            _wend: wendIso,
            _timestampMs: wendTimeMs - idx * 1000, // micro-offset to preserve exact intra-edition priority order
            _photos: dig.photos || {},
            _indexInEdition: idx
          });
        });
      });

      // Sort all items strictly reverse-chronologically (newest on top)
      globalTimeline.sort((a, b) => b._timestampMs - a._timestampMs);

      // Date & Time formatting helpers
      function formatHebrewDateTime(isoStr, isEvening) {
        if (!isoStr) return "";
        try {
          const d = new Date(isoStr);
          const day = d.getUTCDate();
          const monthsHe = [
            "בינואר", "בפברואר", "במרץ", "באפריל", "במאי", "ביוני",
            "ביולי", "באוגוסט", "בספטמבר", "באוקטובר", "בנובמבר", "בדצמבר"
          ];
          const month = monthsHe[d.getUTCMonth()];
          const year = d.getUTCFullYear();
          
          // Localized Israel Time (UTC+2)
          const istH = String((d.getUTCHours() + 2) % 24).padStart(2, "0");
          const istM = String(d.getUTCMinutes()).padStart(2, "0");
          const timeStr = `${istH}:${istM}`;
          const edTag = isEvening ? "ערב" : "ראשי";

          return `${day} ${month} ${year} · ${timeStr} (${edTag})`;
        } catch (e) {
          return isoStr;
        }
      }

      function formatEnglishDateTime(isoStr, isEvening) {
        if (!isoStr) return "";
        try {
          const d = new Date(isoStr);
          const monthsEn = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          const day = d.getUTCDate();
          const month = monthsEn[d.getUTCMonth()];
          const year = d.getUTCFullYear();
          
          const utcH = String(d.getUTCHours()).padStart(2, "0");
          const utcM = String(d.getUTCMinutes()).padStart(2, "0");
          const timeStr = `${utcH}:${utcM} UTC`;
          const edTag = isEvening ? "Evening" : "Main";

          return `${month} ${day}, ${year} · ${timeStr} (${edTag})`;
        } catch (e) {
          return isoStr;
        }
      }

      function formatEditionTitle(dateKey, he) {
        const meta = editionsMeta[dateKey];
        if (!meta) return dateKey;
        const base = meta.baseDate;
        const isEv = meta.isEvening;
        const parts = base.split("-");
        if (parts.length < 3) return dateKey;
        const day = parseInt(parts[2], 10);
        if (he) {
          const monthsHe = {
            "01": "בינואר", "02": "בפברואר", "03": "במרץ", "04": "באפריל",
            "05": "במאי", "06": "ביוני", "07": "ביולי", "08": "באוגוסט",
            "09": "בספטמבר", "10": "באוקטובר", "11": "בנובמבר", "12": "בדצמבר"
          };
          return `${day} ${monthsHe[parts[1]] || parts[1]} ${parts[0]} · ${isEv ? "מהדורת ערב" : "מהדורה ראשית"}`;
        } else {
          const monthsEn = {
            "01": "Jan", "02": "Feb", "03": "Mar", "04": "Apr",
            "05": "May", "06": "Jun", "07": "Jul", "08": "Aug",
            "09": "Sep", "10": "Oct", "11": "Nov", "12": "Dec"
          };
          return `${monthsEn[parts[1]] || parts[1]} ${day}, ${parts[0]} · ${isEv ? "Evening Edition" : "Main Edition"}`;
        }
      }

      function getTimelineCountries(items, isHe) {
        const counts = {};
        items.forEach(it => {
          const raw = isHe ? (it.countryHe || it.country) : (it.country || it.countryHe);
          if (!raw) return;
          const parts = raw.split("/").map(s => s.trim()).filter(Boolean);
          parts.forEach(c => {
            counts[c] = (counts[c] || 0) + 1;
          });
        });
        return Object.keys(counts).map(c => ({
          name: c,
          count: counts[c],
          flag: FLAG_MAP[c.toLowerCase()] || "🌍"
        })).sort((a, b) => b.count - a.count);
      }

      function itemMatchesCountry(it, targetCountry) {
        if (!targetCountry) return true;
        const target = targetCountry.trim().toLowerCase();
        const cen = (it.country || "").toLowerCase().split("/").map(s => s.trim());
        const che = (it.countryHe || "").toLowerCase().split("/").map(s => s.trim());
        return cen.includes(target) || che.includes(target) ||
               (it.country || "").toLowerCase().includes(target) ||
               (it.countryHe || "").toLowerCase().includes(target);
      }

      window.selectCountry = function(c) {
        state.country = c || null;
        state.renderedCount = BATCH_SIZE;
        document.getElementById("country-sheet").classList.remove("open");
        render();
      };

      function populateCountrySheet(allItems, he) {
        const container = document.getElementById("country-sheet-content");
        const countries = getTimelineCountries(allItems, he);

        const focusNamesHe = ["ישראל", "גרמניה", "הודו", "ארצות הברית", "איחוד האמירויות", "אזרבייג'ן", "סינגפור", "מרוקו"];
        const focusNamesEn = ["Israel", "Germany", "India", "United States", "UAE", "Azerbaijan", "Singapore", "Morocco"];
        const focusNames = he ? focusNamesHe : focusNamesEn;

        const focusList = countries.filter(c => focusNames.some(fn => fn.toLowerCase() === c.name.toLowerCase()));
        const otherList = countries.filter(c => !focusNames.some(fn => fn.toLowerCase() === c.name.toLowerCase()));

        let html = `
          <button type="button" class="country-btn all-btn ${!state.country ? "active" : ""}" onclick="selectCountry('')">
            <span>🌐 ${he ? "כל המדינות (הצג הכל ברצף)" : "All Countries (Full Stream)"}</span>
            <span class="c-count">${allItems.length}</span>
          </button>
        `;

        if (focusList.length > 0) {
          html += `
            <div class="country-group-label">${he ? "מדינות מיקוד" : "Focus Countries"}</div>
            <div class="country-chips-row">
              ${focusList.map(c => `
                <button type="button" class="country-btn ${state.country === c.name ? "active" : ""}" onclick="selectCountry('${esc(c.name)}')">
                  <span>${c.flag} ${esc(c.name)}</span>
                  <span class="c-count">${c.count}</span>
                </button>
              `).join("")}
            </div>
          `;
        }

        if (otherList.length > 0) {
          html += `
            <div class="country-group-label">${he ? "מדינות נוספות" : "Other Nations"}</div>
            <div class="country-chips-row">
              ${otherList.map(c => `
                <button type="button" class="country-btn ${state.country === c.name ? "active" : ""}" onclick="selectCountry('${esc(c.name)}')">
                  <span>${c.flag} ${esc(c.name)}</span>
                  <span class="c-count">${c.count}</span>
                </button>
              `).join("")}
            </div>
          `;
        }

        container.innerHTML = html;

        const searchInput = document.getElementById("country-search-input");
        searchInput.value = "";
        searchInput.placeholder = he ? "חיפוש מדינה..." : "Search country...";
        searchInput.oninput = function() {
          const q = this.value.trim().toLowerCase();
          container.querySelectorAll(".country-btn:not(.all-btn)").forEach(btn => {
            const txt = btn.textContent.toLowerCase();
            btn.style.display = (!q || txt.includes(q)) ? "flex" : "none";
          });
        };
      }

      function populateDateSheet(he) {
        const container = document.getElementById("date-list-buttons");
        let html = `
          <button type="button" class="date-jump-btn all-dates-btn ${!state.dateFilter ? "active" : ""}" onclick="setDateFilter(null)">
            <span>🌐 ${he ? "ציר זמן רציף מלא (כל המהדורות)" : "Full Continuous Timeline (All Editions)"}</span>
            <span>${globalTimeline.length} ${he ? "דיווחים" : "reports"}</span>
          </button>
        `;

        sortedDates.forEach((k) => {
          const meta = editionsMeta[k];
          if (!meta) return;
          const isSelected = state.dateFilter === k;
          const title = formatEditionTitle(k, he);
          html += `
            <button type="button" class="date-jump-btn ${isSelected ? "active" : ""}" onclick="jumpToOrFilterDate('${k}')">
              <span>🗓️ ${title}</span>
              <span style="font-size:0.78rem;opacity:0.8;">${meta.itemCount} ${he ? "פריטים" : "items"}</span>
            </button>
          `;
        });
        container.innerHTML = html;
      }

      window.setDateFilter = function(df) {
        state.dateFilter = df;
        state.renderedCount = BATCH_SIZE;
        document.getElementById("date-sheet").classList.remove("open");
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      window.jumpToOrFilterDate = function(k) {
        document.getElementById("date-sheet").classList.remove("open");
        if (state.dateFilter) {
          // If already in isolated mode, switch filter
          state.dateFilter = k;
          state.renderedCount = BATCH_SIZE;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
          return;
        }

        // In continuous mode: ensure items up to this edition are rendered, then scroll to it
        const targetEl = document.getElementById("edition-" + k);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          // Find how many items exist before this edition and expand renderedCount
          let countNeeded = 0;
          for (let i = 0; i < filteredItemsCache.length; i++) {
            countNeeded++;
            if (filteredItemsCache[i]._editionKey === k) {
              countNeeded += 10;
              break;
            }
          }
          state.renderedCount = Math.max(state.renderedCount, countNeeded);
          render();
          setTimeout(() => {
            const el = document.getElementById("edition-" + k);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 60);
        }
      };

      function hid(id, he) {
        if (!he) return id;
        const map = { A: "א", B: "ב", C: "ג", D: "ד" };
        return (map[id[0]] || id[0]) + id.slice(1);
      }

      function esc(str) {
        const div = document.createElement("div");
        div.textContent = str || "";
        return div.innerHTML;
      }

      function showToast(msg) {
        const t = document.getElementById("capsule-toast");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }

      async function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (e) {
            console.warn("navigator.clipboard.writeText failed:", e);
          }
        }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "-9999px";
          ta.style.left = "-9999px";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (err) {
          console.warn("execCommand copy fallback failed:", err);
          return false;
        }
      }

      window.shareStory = async function(uid, btn) {
        let it = null;
        if (typeof filteredItemsCache !== "undefined" && filteredItemsCache.length) {
          it = filteredItemsCache.find(x => x._uid === uid || x.id === uid);
        }
        if (!it && typeof globalTimeline !== "undefined" && globalTimeline.length) {
          it = globalTimeline.find(x => x._uid === uid || x.id === uid);
        }

        const he = state.lang === "he";
        const title = it ? `${hid(it.id, he)}. ${it.h[state.lang]}` : (he ? "עדכון טכנולוגיות הגנה" : "Defense Technology Digest");
        const editionKey = it ? it._editionKey : (state.dateFilter || (feed.dates && feed.dates[0]) || "");

        const cleanOrigin = window.location.href.split("?")[0].split("#")[0];
        const shareUrl = `${cleanOrigin}?date=${encodeURIComponent(editionKey)}&lang=${state.lang}#story-${uid}`;

        let sharedViaNative = false;
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 800);

        if (isMobile && navigator.share) {
          try {
            await navigator.share({
              title: title,
              text: title,
              url: shareUrl
            });
            sharedViaNative = true;
          } catch (err) {
            if (err.name === "AbortError") {
              return; // User cancelled share dialog
            }
            console.warn("navigator.share failed, falling back to clipboard:", err);
          }
        }

        if (!sharedViaNative) {
          const success = await copyToClipboard(shareUrl);
          if (success) {
            showToast(he ? "הקישור הועתק ללוח!" : "Link copied to clipboard!");
            if (btn) {
              const textSpan = btn.querySelector(".share-text") || btn;
              const iconSpan = btn.querySelector(".share-icon");
              const origText = textSpan.textContent;
              const origIcon = iconSpan ? iconSpan.textContent : "";
              if (iconSpan) iconSpan.textContent = "✓";
              textSpan.textContent = he ? "הועתק!" : "Copied!";
              btn.classList.add("copied");
              setTimeout(() => {
                if (iconSpan) iconSpan.textContent = origIcon;
                textSpan.textContent = origText;
                btn.classList.remove("copied");
              }, 2000);
            }
          } else {
            prompt(he ? "העתק את הקישור לידיעה:" : "Copy link to story:", shareUrl);
          }
        }
      };

      window.checkForNewNews = function() {
        showToast(state.lang === "he" ? "מרענן פיד מודיעין..." : "Checking for updates...");
        setTimeout(() => {
          location.reload();
        }, 500);
      };

      const mainEl = document.getElementById("app-main");
      const capLangText = document.getElementById("cap-lang-text");
      const capDateText = document.getElementById("cap-date-text");
      const capCountryBtn = document.getElementById("cap-country");
      const capCountryText = document.getElementById("cap-country-text");
      const btnScrollTop = document.getElementById("btn-scroll-top");

      // Scroll listener for Top Button
      window.addEventListener("scroll", () => {
        if (window.scrollY > 400) {
          btnScrollTop.classList.add("visible");
        } else {
          btnScrollTop.classList.remove("visible");
        }
      }, { passive: true });

      btnScrollTop.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      let filteredItemsCache = [];
      let scrollObserver = null;

      function getFilteredItems() {
        let items = globalTimeline;

        // Filter by Date if single edition is isolated
        if (state.dateFilter) {
          items = items.filter(i => i._editionKey === state.dateFilter);
        }

        // Filter by Domain
        if (state.domain !== "all") {
          items = items.filter(i => i.domain === state.domain);
        }

        // Filter by Country
        if (state.country) {
          items = items.filter(i => itemMatchesCountry(i, state.country));
        }

        return items;
      }

      function setupInfiniteScrollSentinel() {
        if (scrollObserver) {
          scrollObserver.disconnect();
          scrollObserver = null;
        }

        const sentinel = document.getElementById("feed-scroll-sentinel");
        if (!sentinel) return;

        scrollObserver = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) {
            if (state.renderedCount < filteredItemsCache.length) {
              state.renderedCount = Math.min(state.renderedCount + BATCH_SIZE, filteredItemsCache.length);
              renderFeedBatch();
            }
          }
        }, { rootMargin: "600px" });

        scrollObserver.observe(sentinel);
      }

      function renderFeedBatch() {
        const feedGrid = document.getElementById("feed-grid-container");
        if (!feedGrid) return;

        const he = state.lang === "he";
        const domLabels = he
          ? { air: "הגנה אווירית", aerial: "אווירי", strike: "תקיפה", naval: "ימי" }
          : { air: "Air Defense", aerial: "Aerial", strike: "Strike", naval: "Naval" };

        const currentRenderedNodes = feedGrid.querySelectorAll(".story-card").length;
        const targetItems = filteredItemsCache.slice(0, state.renderedCount);
        const newSlice = targetItems.slice(currentRenderedNodes);

        if (newSlice.length === 0) {
          updateSentinelUI();
          return;
        }

        let lastEditionKey = currentRenderedNodes > 0
          ? targetItems[currentRenderedNodes - 1]._editionKey
          : null;

        const fragment = document.createDocumentFragment();

        newSlice.forEach((it) => {
          // If we transitioned to a new edition and we are in full continuous timeline mode
          if (!state.dateFilter && it._editionKey !== lastEditionKey) {
            lastEditionKey = it._editionKey;
            const edMeta = editionsMeta[it._editionKey] || {};
            const dividerDiv = document.createElement("div");
            dividerDiv.className = "timeline-edition-divider";
            dividerDiv.id = `edition-${it._editionKey}`;
            dividerDiv.innerHTML = `
              <span class="timeline-divider-line"></span>
              <div class="timeline-edition-badge">
                <span class="timeline-edition-tag">🗓️ ${formatEditionTitle(it._editionKey, he)}</span>
                <span class="timeline-edition-time">${he ? formatHebrewDateTime(edMeta.wend, edMeta.isEvening) : formatEnglishDateTime(edMeta.wend, edMeta.isEvening)}</span>
                <span class="timeline-edition-count">${edMeta.itemCount || ""} ${he ? "דיווחים" : "reports"}</span>
              </div>
              <span class="timeline-divider-line"></span>
            `;
            fragment.appendChild(dividerDiv);
          }

          const photos = it._photos || {};
          const pinfo = photos[it.id];
          const hasPhoto = Boolean(pinfo && (pinfo.url || pinfo.local_src));
          const isHigh = it.priority === "high";

          // Photo Markup
          let mediaHtml = "";
          if (hasPhoto) {
            const primarySrc = pinfo.local_src || pinfo.url;
            const remoteUrl = pinfo.url || "";
            const cred = he ? (pinfo.credit_he || pinfo.credit_en) : pinfo.credit_en;
            const fallbackJs = (remoteUrl && primarySrc !== remoteUrl)
              ? `if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${esc(remoteUrl)}';}else{const mb=this.closest('.story-media-box');if(mb)mb.style.display='none';}`
              : `const mb=this.closest('.story-media-box');if(mb)mb.style.display='none';`;

            mediaHtml = `
              <div class="story-media-box">
                <img src="${esc(primarySrc)}" alt="${esc(it.h[state.lang])}" loading="lazy" referrerpolicy="no-referrer" onerror="${fallbackJs}" />
                <div class="media-caption">
                  <span>${esc(cred)}</span>
                  <a href="${esc(remoteUrl || primarySrc)}" target="_blank" rel="noopener">${he ? "מקור תמונה" : "Photo Source"}</a>
                </div>
              </div>
            `;
          }

          // Deep Specs Markup
          const hasDeepSpecs = Boolean(it.figs || it.why || it.israel);
          let specsHtml = "";
          if (hasDeepSpecs) {
            specsHtml = `
              <details class="specs-disclosure">
                <summary class="specs-summary">
                  <span>${he ? "🔍 ניתוח מעמיק והשלכות לישראל" : "🔍 Deep Dive & Strategic Implications"}</span>
                  <span class="specs-chevron">▼</span>
                </summary>
                <div class="specs-body">
                  ${it.figs ? `
                    <div class="spec-block">
                      <span class="spec-label">${he ? "נתונים טכניים מרכזיים:" : "Key Specs & Figures:"}</span>
                      <span>${esc(it.figs[state.lang])}</span>
                    </div>
                  ` : ""}
                  ${it.why ? `
                    <div class="spec-block">
                      <span class="spec-label">${he ? "למה זה משמעותי:" : "Why It Matters:"}</span>
                      <span>${esc(it.why[state.lang])}</span>
                    </div>
                  ` : ""}
                  ${it.israel ? `
                    <div class="israel-box">
                      <span class="spec-label" style="color:var(--accent);">${he ? "משמעויות לישראל ולמזה\"ת:" : "Israel & Regional Implications:"}</span>
                      <span>${esc(it.israel[state.lang])}</span>
                    </div>
                  ` : ""}
                </div>
              </details>
            `;
          }

          const srcLinks = (it.src || [])
            .map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`)
            .join(" · ");

          const itemFormattedTime = he
            ? formatHebrewDateTime(it._wend, it._isEvening)
            : formatEnglishDateTime(it._wend, it._isEvening);

          const card = document.createElement("article");
          card.className = `story-card ${isHigh ? "high-priority" : ""}`;
          card.id = `story-${it._uid}`;
          card.setAttribute("data-uid", it._uid);
          card.setAttribute("data-item-id", it.id);
          card.setAttribute("data-edition", it._editionKey);
          card.innerHTML = `
            <div class="story-top-meta">
              <div class="meta-pills">
                <span class="mini-badge timestamp-badge" title="${he ? "זמן פרסום הדיווח" : "Publication Timestamp"}">
                  <span class="time-icon">🕒</span>
                  <span>${itemFormattedTime}</span>
                </span>
                <span class="mini-badge" style="font-weight:800;">${esc(hid(it.id, he))}</span>
                <span class="mini-badge domain">${esc(domLabels[it.domain])}</span>
                <span class="mini-badge">${esc(he ? it.countryHe : it.country)}</span>
                ${isHigh ? `<span class="mini-badge priority-high">${he ? "עדיפות" : "HIGH PRIORITY"}</span>` : ""}
              </div>
              <button type="button" class="story-share-btn" onclick="shareStory('${it._uid}', this)" data-uid="${it._uid}" data-item-id="${it.id}" title="${he ? 'שתף' : 'Share'}">
                <span class="share-icon">↗</span> <span class="share-text">${he ? "שתף" : "Share"}</span>
              </button>
            </div>

            <h3 class="story-title">${esc(it.h[state.lang])}</h3>

            ${mediaHtml}

            <p class="story-lead">${esc(it.what[state.lang])}</p>

            ${specsHtml}

            <div class="story-sources">
              <strong>${he ? "מקורות: " : "Sources: "}</strong>${srcLinks}
            </div>
          `;
          fragment.appendChild(card);
        });

        feedGrid.appendChild(fragment);
        updateSentinelUI();
      }

      function updateSentinelUI() {
        const sentinelBox = document.getElementById("feed-sentinel-wrapper");
        if (!sentinelBox) return;

        const he = state.lang === "he";
        if (state.renderedCount >= filteredItemsCache.length) {
          sentinelBox.innerHTML = `
            <div class="archive-end-banner">
              <h4>${he ? "🏁 הגעת לתחילת ציר הזמן" : "🏁 Beginning of Archive Reached"}</h4>
              <p>${he ? `כל ${filteredItemsCache.length} הדיווחים נטענו ברצף.` : `All ${filteredItemsCache.length} reports loaded continuously.`}</p>
              <button type="button" class="live-refresh-action" onclick="window.scrollTo({top:0,behavior:'smooth'})">
                ↑ ${he ? "חזרה לראש הפיד" : "Back to Top"}
              </button>
            </div>
          `;
          if (scrollObserver) {
            scrollObserver.disconnect();
          }
        } else {
          sentinelBox.innerHTML = `
            <div class="feed-loader-box">
              <div class="feed-spinner"></div>
              <span>${he ? `טוען דיווחים נוספים מתוך ${filteredItemsCache.length}...` : `Loading more reports (${state.renderedCount}/${filteredItemsCache.length})...`}</span>
            </div>
            <div id="feed-scroll-sentinel"></div>
          `;
          setupInfiniteScrollSentinel();
        }
      }

      function render() {
        const he = state.lang === "he";
        document.documentElement.lang = he ? "he" : "en";
        document.documentElement.dir = he ? "rtl" : "ltr";

        filteredItemsCache = getFilteredItems();

          ? formatHebrewDateTime(latestMeta.wend, latestMeta.isEvening)

          : "Continuous Real-Time Defense Tech Feed · Weapons, Procurement & Strategy";

          aerial: globalTimeline.filter(i => i.domain === "aerial").length,

        // Build Main Layout HTML

        // 3. Editor's Spotlight Carousel (Shows breaking High-Priority from latest edition)

            const itemTime = he
              ? formatHebrewDateTime(it._wend, it._isEvening)
              : formatEnglishDateTime(it._wend, it._isEvening);

            return `
              <article class="carousel-slide" onclick="document.getElementById('story-${it._uid}').scrollIntoView({behavior:'smooth',block:'center'});">
                <div class="carousel-img-wrap">

          }).join("");

          html += `
            <section class="carousel-section">
              <div class="section-label">${he ? "בחירת המערכת · עדכונים חמים" : "Editor's Spotlight · Breaking Updates"}</div>
              <h2 class="section-heading">${he ? "התפתחויות מפתח באמל\"ח עולמי" : "Key Strategic Milestones"}</h2>
              <div class="carousel-track">
                ${carouselSlides}
              </div>
            </section>
          `;
        }

        // 4. Feed Grid Container + Sentinel
        if (filteredItemsCache.length === 0) {
          html += `
            <div class="archive-end-banner">
              <h4>${he ? "לא נמצאו דיווחים התואמים לסינון" : "No Reports Found"}</h4>
              <p>${he ? "נסה לשנות את תחום הסינון או את המדינה שנבחרה." : "Try clearing domain or country filters."}</p>
              <button type="button" class="clear-filter-btn" onclick="clearAllFilters()">${he ? "הצג את כל הפיד הרציף" : "Show Full Continuous Feed"}</button>
            </div>
          `;
        } else {
          html += `
            <section class="feed-section">
              <div class="feed-grid" id="feed-grid-container"></div>
              <div id="feed-sentinel-wrapper"></div>
            </section>
          `;
        }

        mainEl.innerHTML = html;

        if (filteredItemsCache.length > 0) {
          renderFeedBatch();
        }
      }

      window.clearAllFilters = function() {
        state.country = null;
        state.dateFilter = null;
        state.domain = "all";
        state.renderedCount = BATCH_SIZE;
        document.querySelectorAll(".editorial-tabs .tab-item").forEach(b => {
          b.classList.toggle("active", b.getAttribute("data-domain") === "all");
        });
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      // Capsule Event Handlers
      document.getElementById("cap-lang").addEventListener("click", () => {
        state.lang = state.lang === "en" ? "he" : "en";
        try { localStorage.setItem("defense_brief_lang", state.lang); } catch (e) {}
        render();
      });

      document.getElementById("cap-date").addEventListener("click", () => {
        document.getElementById("date-sheet").classList.add("open");
      });
      document.getElementById("close-date-sheet").addEventListener("click", () => {
        document.getElementById("date-sheet").classList.remove("open");
      });

      document.getElementById("cap-country").addEventListener("click", () => {
        document.getElementById("country-sheet").classList.add("open");
      });
      document.getElementById("close-country-sheet").addEventListener("click", () => {
        document.getElementById("country-sheet").classList.remove("open");
      });

      document.getElementById("cap-bluf").addEventListener("click", () => {
        document.getElementById("bluf-sheet").classList.add("open");
      });
      document.getElementById("close-bluf-sheet").addEventListener("click", () => {
        document.getElementById("bluf-sheet").classList.remove("open");
      });

      // Domain Tabs Event Handlers
      document.querySelectorAll(".tab-item").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".editorial-tabs .tab-item").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.domain = btn.getAttribute("data-domain");
          state.renderedCount = BATCH_SIZE;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      // Close sheets on backdrop click
      document.querySelectorAll(".sheet-backdrop").forEach((sheet) => {
        sheet.addEventListener("click", (e) => {
          if (e.target === sheet) sheet.classList.remove("open");
        });
      });

      function scrollToHashTarget() {
        const hash = window.location.hash;
        if (!hash) return;
        const targetRaw = hash.replace(/^#/, "");
        if (!targetRaw) return;

        let el = document.getElementById(targetRaw);
        if (!el) {
          const clean = targetRaw.replace(/^(story-|item-)/, "");
          el = document.getElementById("story-" + clean) ||
               document.getElementById("item-" + clean) ||
               document.querySelector(`[data-uid="${clean}"]`) ||
               document.querySelector(`[data-item-id="${clean}"]`);
        }

        if (!el && typeof filteredItemsCache !== "undefined") {
          const clean = targetRaw.replace(/^(story-|item-)/, "");
          const idx = filteredItemsCache.findIndex(x => x._uid === clean || x.id === clean || x._uid.endsWith("__" + clean));
          if (idx >= 0) {
            state.renderedCount = Math.max(state.renderedCount, idx + 10);
            render();
            const targetUid = filteredItemsCache[idx]._uid;
            el = document.getElementById("story-" + targetUid) || document.querySelector(`[data-uid="${targetUid}"]`);
          } else if (typeof globalTimeline !== "undefined") {
            const foundInGlobal = globalTimeline.find(x => x._uid === clean || x.id === clean || x._uid.endsWith("__" + clean));
            if (foundInGlobal) {
              state.dateFilter = foundInGlobal._editionKey;
              state.renderedCount = 100;
              render();
              el = document.getElementById("story-" + foundInGlobal._uid) || document.querySelector(`[data-uid="${foundInGlobal._uid}"]`);
            }
          }
        }

        if (el) {
          setTimeout(() => {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            el.classList.add("highlight-target");
            setTimeout(() => {
              el.classList.remove("highlight-target");
            }, 2500);
          }, 150);
        }
      }

      // Initial Render
      render();
      if (window.location.hash) {
        setTimeout(scrollToHashTarget, 100);
      }
      window.addEventListener("hashchange", scrollToHashTarget);
    })();
  </script>
</body>
</html>
