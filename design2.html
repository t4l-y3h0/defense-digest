<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <title>Design 2 — Bottom Navigation Bar (Bloomberg/X style)</title>
  <style>
    :root {
      --bg: #f4f5f8;
      --card: #ffffff;
      --card-sec: #f8f9fb;
      --border: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.05);
      --text: #111827;
      --text-sec: #4b5563;
      --text-ter: #9ca3af;
      --accent: #2563eb;
      --red: #dc2626;
      --bottom-bg: rgba(255, 255, 255, 0.88);
      --chip-bg: rgba(0, 0, 0, 0.05);
      --chip-active: #111827;
      --chip-active-text: #ffffff;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f17;
        --card: #151c28;
        --card-sec: #1e2738;
        --border: rgba(255, 255, 255, 0.1);
        --border-subtle: rgba(255, 255, 255, 0.05);
        --text: #f3f4f6;
        --text-sec: #9ca3af;
        --text-ter: #6b7280;
        --accent: #3b82f6;
        --red: #ef4444;
        --bottom-bg: rgba(15, 23, 42, 0.88);
        --chip-bg: rgba(255, 255, 255, 0.1);
        --chip-active: #ffffff;
        --chip-active-text: #0b0f17;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { overflow-x: clip; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overflow-wrap: break-word;
      /* Extra bottom padding so content never gets covered by the bottom bar */
      padding-block-end: calc(75px + max(1rem, env(safe-area-inset-bottom, 0px)));
      padding-inline-start: env(safe-area-inset-left, 0px);
      padding-inline-end: env(safe-area-inset-right, 0px);
    }

    :where(a, code) { overflow-wrap: anywhere; word-break: break-word; }

    /* Top Masthead (Non-sticky, scrolls away) */
    header.masthead {
      padding-top: max(1.2rem, env(safe-area-inset-top, 0px));
      padding-inline: 1rem;
      padding-bottom: 0.75rem;
      max-inline-size: 1120px;
      margin-inline: auto;
    }

    .masthead-eyebrow {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--red);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .masthead-eyebrow::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .masthead-title {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin: 0 0 0.25rem 0;
    }

    .masthead-meta {
      font-size: 0.85rem;
      color: var(--text-sec);
      font-weight: 500;
      margin-bottom: 0.85rem;
    }

    /* Category Filter Pills (In Masthead) */
    .filter-pills-row {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-block: 4px;
    }
    .filter-pills-row::-webkit-scrollbar { display: none; }

    .pill-btn {
      flex: 0 0 auto;
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .pill-btn.active {
      background: var(--chip-active);
      color: var(--chip-active-text);
      border-color: var(--chip-active);
    }

    .pill-badge {
      font-size: 0.7rem;
      padding: 1px 5px;
      border-radius: 8px;
      background: rgba(120, 120, 128, 0.2);
    }
    .pill-btn.active .pill-badge { background: rgba(255, 255, 255, 0.25); }

    /* Main Container */
    main.content-main {
      max-inline-size: 1120px;
      margin-inline: auto;
      padding-inline: 1rem;
    }

    /* Design Navigation Banner */
    .design-banner {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08), rgba(220, 38, 38, 0.06));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.65rem 0.85rem;
      margin-block-end: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.82rem;
    }

    .design-banner-links { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .design-tag {
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--card);
      color: var(--accent);
      border: 1px solid var(--border);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.78rem;
    }
    .design-tag.current { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Top Stories Carousel */
    .carousel-section { margin-block-end: 1.75rem; }
    .carousel-heading {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0 0 0.75rem 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .carousel-track {
      display: flex;
      gap: 0.85rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-block: 4px;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .carousel-slide {
      flex: 0 0 86%;
      max-inline-size: 400px;
      scroll-snap-align: center;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .carousel-img-wrap {
      inline-size: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--card-sec);
      position: relative;
    }
    .carousel-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .carousel-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--red);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 5px;
      text-transform: uppercase;
    }
    html[dir="rtl"] .carousel-tag { left: auto; right: 8px; }

    .carousel-content { padding: 0.85rem; flex: 1; display: flex; flex-direction: column; }
    .carousel-tags { font-size: 0.7rem; font-weight: 700; color: var(--text-sec); text-transform: uppercase; margin-bottom: 0.35rem; }
    .carousel-title { margin: 0 0 0.35rem 0; font-size: 1rem; font-weight: 700; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .carousel-desc { font-size: 0.82rem; color: var(--text-sec); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* Feed Grid / Cards */
    .feed-grid { display: flex; flex-direction: column; gap: 1rem; }
    .story-card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 1.15rem;
    }
    .story-card.high-priority { border-inline-start: 4px solid var(--red); }

    .story-top-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-block-end: 0.5rem; }
    .meta-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .mini-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--chip-bg);
      color: var(--text-sec);
      text-transform: uppercase;
    }
    .mini-badge.priority-high { background: rgba(220, 38, 38, 0.12); color: var(--red); }
    .mini-badge.domain { background: rgba(37, 99, 235, 0.1); color: var(--accent); }

    .story-share-btn {
      background: var(--chip-bg);
      border: none;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }
    .story-share-btn.copied {
      background: var(--accent);
      color: #fff;
    }
    .story-card.highlight-target {
      animation: targetPulse 2.5s ease-out;
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }
    @keyframes targetPulse {
      0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
      50% { box-shadow: 0 0 20px 4px rgba(37, 99, 235, 0.4); }
      100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
    }

    .story-title { margin: 0 0 0.65rem 0; font-size: 1.18rem; font-weight: 800; line-height: 1.35; }
    .story-media-box { margin-block-end: 0.85rem; border-radius: var(--radius-sm); overflow: hidden; background: var(--card-sec); border: 1px solid var(--border-subtle); }
    .story-media-box img { inline-size: 100%; aspect-ratio: 16 / 9; max-block-size: 280px; object-fit: cover; display: block; }
    .media-caption { padding: 0.4rem 0.65rem; font-size: 0.72rem; color: var(--text-ter); display: flex; justify-content: space-between; align-items: center; border-block-start: 1px solid var(--border-subtle); }
    .media-caption a { color: var(--accent); text-decoration: none; }

    .story-lead { font-size: 0.94rem; line-height: 1.5; margin: 0 0 0.75rem 0; color: var(--text); }

    .specs-disclosure { margin-block: 0.75rem; border-radius: var(--radius-sm); background: var(--card-sec); border: 1px solid var(--border-subtle); overflow: hidden; }
    .specs-summary { padding: 0.6rem 0.75rem; font-size: 0.82rem; font-weight: 700; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; color: var(--accent); }
    .specs-summary::-webkit-details-marker { display: none; }
    .specs-chevron { transition: transform 0.2s ease; font-size: 0.72rem; }
    details[open] .specs-chevron { transform: rotate(180deg); }
    .specs-body { padding: 0.75rem; border-block-start: 1px solid var(--border-subtle); font-size: 0.86rem; }
    .spec-block { margin-block-end: 0.5rem; }
    .spec-block:last-child { margin-block-end: 0; }
    .spec-label { font-weight: 700; color: var(--text); display: block; margin-bottom: 2px; }

    .story-sources { margin-block-start: 0.75rem; padding-block-start: 0.5rem; border-block-start: 1px solid var(--border-subtle); font-size: 0.78rem; color: var(--text-sec); }
    .story-sources a { color: var(--accent); text-decoration: none; font-weight: 600; }

    /* Sticky Bottom Thumb Bar */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 500;
      background-color: var(--bottom-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-block-start: 1px solid var(--border);
      padding-top: 6px;
      padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
    }

    .bottom-nav-inner {
      max-inline-size: 600px;
      margin-inline: auto;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-inline: 0.5rem;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-sec);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: color 0.15s ease;
      touch-action: manipulation;
    }

    .nav-tab-btn.active, .nav-tab-btn:hover {
      color: var(--accent);
    }

    .nav-tab-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    /* Slide-Up Bottom Sheet (for BLUF & Date Picker) */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .sheet-backdrop.open { display: flex; }

    .bottom-sheet {
      background: var(--card);
      border-radius: 20px 20px 0 0;
      border: 1px solid var(--border);
      width: 100%;
      max-inline-size: 650px;
      max-block-size: 80vh;
      overflow-y: auto;
      padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px)) 1.25rem;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-grabber {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--text-ter);
      margin: 0 auto 1rem auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .sheet-title {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0;
    }

    .sheet-close-btn {
      background: var(--chip-bg);
      border: none;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
    }

    .bluf-sheet-list { margin: 0; padding-inline-start: 1.2rem; }
    .bluf-sheet-list li { margin-block-end: 0.75rem; font-size: 0.95rem; line-height: 1.5; }

    #bottom-toast {
      position: fixed;
      bottom: calc(75px + max(1rem, env(safe-area-inset-bottom, 0px)));
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: rgba(30, 30, 32, 0.92);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    #bottom-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <!-- Top Masthead (Clean, scrolls away naturally) -->
  <header class="masthead">
    <div class="masthead-eyebrow">OPEN SOURCE INTELLIGENCE</div>
    <h1 class="masthead-title" id="ui-brand-title">Defense Brief</h1>
    <div class="masthead-meta" id="ui-brand-sub">Loading edition...</div>

    <div class="filter-pills-row" aria-label="Categories">
      <button type="button" class="pill-btn active" data-domain="all">
        <span id="pill-all-label">All Stories</span>
        <span class="pill-badge" id="count-all">0</span>
      </button>
      <button type="button" class="pill-btn" data-domain="air">
        <span id="pill-air-label">Air Defense</span>
        <span class="pill-badge" id="count-air">0</span>
      </button>
      <button type="button" class="pill-btn" data-domain="aerial">
        <span id="pill-aerial-label">Aerial</span>
        <span class="pill-badge" id="count-aerial">0</span>
      </button>
      <button type="button" class="pill-btn" data-domain="strike">
        <span id="pill-strike-label">Strike</span>
        <span class="pill-badge" id="count-strike">0</span>
      </button>
      <button type="button" class="pill-btn" data-domain="naval">
        <span id="pill-naval-label">Naval</span>
        <span class="pill-badge" id="count-naval">0</span>
      </button>
    </div>
  </header>

  <main class="content-main" id="app-main"></main>

  <!-- Sticky Bottom Thumb Bar -->
  <nav class="bottom-nav" aria-label="Bottom Navigation">
    <div class="bottom-nav-inner">
      <button type="button" class="nav-tab-btn active" id="tab-feed">
        <span class="nav-tab-icon">📰</span>
        <span id="tab-feed-label">Feed</span>
      </button>
      <button type="button" class="nav-tab-btn" id="tab-top">
        <span class="nav-tab-icon">🔥</span>
        <span id="tab-top-label">Top</span>
      </button>
      <button type="button" class="nav-tab-btn" id="tab-bluf">
        <span class="nav-tab-icon">⚡</span>
        <span id="tab-bluf-label">BLUF</span>
      </button>
      <button type="button" class="nav-tab-btn" id="tab-date">
        <span class="nav-tab-icon">📅</span>
        <span id="tab-date-label">Date</span>
      </button>
      <button type="button" class="nav-tab-btn" id="tab-lang">
        <span class="nav-tab-icon">🌐</span>
        <span id="tab-lang-label">עברית</span>
      </button>
      <button type="button" class="nav-tab-btn" id="tab-style">
        <span class="nav-tab-icon">🎨</span>
        <span id="tab-style-label">Style</span>
      </button>
    </div>
  </nav>

  <!-- BLUF Bottom Sheet -->
  <div class="sheet-backdrop" id="bluf-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title" id="sheet-bluf-title">Executive Briefing (BLUF)</h2>
        <button type="button" class="sheet-close-btn" id="close-bluf-sheet">Done</button>
      </div>
      <ul class="bluf-sheet-list" id="bluf-sheet-content"></ul>
    </div>
  </div>

  <!-- Date Bottom Sheet -->
  <div class="sheet-backdrop" id="date-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title">Select Edition Date</h2>
        <button type="button" class="sheet-close-btn" id="close-date-sheet">Done</button>
      </div>
      <div id="date-list-buttons" style="display:flex;flex-direction:column;gap:8px;padding-block:6px;"></div>
    </div>
  </div>

  <!-- Style / Design Bottom Sheet -->
  <div class="sheet-backdrop" id="style-sheet">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <h2 class="sheet-title">Select Mobile Design</h2>
        <button type="button" class="sheet-close-btn" id="close-style-sheet">Done</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;padding-block:6px;">
        <a href="design1.html" class="pill-btn" style="border-radius:10px;justify-content:center;padding:12px;font-size:0.95rem;" id="link-d1">Design 1: Apple 2-Tier Bar</a>
        <a href="design2.html" class="pill-btn active" style="border-radius:10px;justify-content:center;padding:12px;font-size:0.95rem;" id="link-d2">Design 2: Bottom Navigation Bar (Current)</a>
        <a href="design3.html" class="pill-btn" style="border-radius:10px;justify-content:center;padding:12px;font-size:0.95rem;" id="link-d3">Design 3: Floating Capsule Masthead</a>
        <a href="index.html" class="pill-btn" style="border-radius:10px;justify-content:center;padding:12px;font-size:0.95rem;" id="link-classic">Classic Ops Terminal</a>
      </div>
    </div>
  </div>

  <div id="bottom-toast" role="status" aria-live="polite"></div>

  <script src="./feed_bundle.js"></script>
  <script>
    (function () {
      const feed = window.DEFENSE_BRIEF_FEED || { dates: [], digests: {} };
      const urlParams = new URLSearchParams(window.location.search);
      let initialDate = feed.dates[0] || "";
      if (urlParams.get("date") && feed.digests[urlParams.get("date")]) {
        initialDate = urlParams.get("date");
      }
      let initialLang = "en";
      if (urlParams.get("lang") === "he" || urlParams.get("lang") === "en") {
        initialLang = urlParams.get("lang");
      }

      let state = {
        date: initialDate,
        lang: initialLang,
        filter: "all"
      };

      const mainEl = document.getElementById("app-main");
      const tabLangLabel = document.getElementById("tab-lang-label");

      function hid(id, he) {
        if (!he) return id;
        const map = { A: "א", B: "ב", C: "ג", D: "ד" };
        return (map[id[0]] || id[0]) + id.slice(1);
      }

      function esc(str) {
        const div = document.createElement("div");
        div.textContent = str || "";
        return div.innerHTML;
      }

      function showToast(msg) {
        const t = document.getElementById("bottom-toast");
        if (!t) return;
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2000);
      }

      async function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (e) {
            console.warn("navigator.clipboard failed:", e);
          }
        }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "-9999px";
          ta.style.left = "-9999px";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (err) {
          console.warn("execCommand copy fallback failed:", err);
          return false;
        }
      }

      window.shareStory = async function(id, btn) {
        let it = null;
        if (feed && feed.digests && feed.digests[state.date] && feed.digests[state.date].items) {
          it = feed.digests[state.date].items.find(x => x.id === id);
        }
        const he = state.lang === "he";
        const title = it ? `${hid(it.id, he)}. ${it.h[state.lang]}` : "Defense Brief";
        const cleanOrigin = window.location.href.split("?")[0].split("#")[0];
        const shareUrl = `${cleanOrigin}?date=${encodeURIComponent(state.date)}&lang=${state.lang}#story-${id}`;

        let sharedViaNative = false;
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 800);

        if (isMobile && navigator.share) {
          try {
            await navigator.share({ title: title, text: title, url: shareUrl });
            sharedViaNative = true;
          } catch (err) {
            if (err.name === "AbortError") return;
            console.warn("navigator.share failed, falling back to clipboard:", err);
          }
        }

        if (!sharedViaNative) {
          const success = await copyToClipboard(shareUrl);
          if (success) {
            showToast(he ? "הקישור הועתק ללוח!" : "Link copied to clipboard!");
            if (btn) {
              const textSpan = btn.querySelector(".share-text") || btn;
              const iconSpan = btn.querySelector(".share-icon");
              const origText = textSpan.textContent;
              const origIcon = iconSpan ? iconSpan.textContent : "";
              if (iconSpan) iconSpan.textContent = "✓";
              textSpan.textContent = he ? "הועתק!" : "Copied!";
              btn.classList.add("copied");
              setTimeout(() => {
                if (iconSpan) iconSpan.textContent = origIcon;
                textSpan.textContent = origText;
                btn.classList.remove("copied");
              }, 2000);
            }
          } else {
            prompt(he ? "העתק את הקישור לידיעה:" : "Copy link to story:", shareUrl);
          }
        }
      };

      function updateCategoryCounts(items) {
        const he = state.lang === "he";
        document.getElementById("count-all").textContent = items.length;
        document.getElementById("count-air").textContent = items.filter(i => i.domain === "air").length;
        document.getElementById("count-aerial").textContent = items.filter(i => i.domain === "aerial").length;
        document.getElementById("count-strike").textContent = items.filter(i => i.domain === "strike").length;
        document.getElementById("count-naval").textContent = items.filter(i => i.domain === "naval").length;

        document.getElementById("pill-all-label").textContent = he ? "הכל" : "All Stories";
        document.getElementById("pill-air-label").textContent = he ? "הגנה אווירית" : "Air Defense";
        document.getElementById("pill-aerial-label").textContent = he ? "אווירי" : "Aerial";
        document.getElementById("pill-strike-label").textContent = he ? "תקיפה" : "Strike";
        document.getElementById("pill-naval-label").textContent = he ? "ימי" : "Naval";

        // Update bottom tab labels
        tabLangLabel.textContent = he ? "English" : "עברית";
        document.getElementById("tab-feed-label").textContent = he ? "פיד" : "Feed";
        document.getElementById("tab-top-label").textContent = he ? "מובילים" : "Top";
        document.getElementById("tab-bluf-label").textContent = he ? "תקציר" : "BLUF";
        document.getElementById("tab-date-label").textContent = he ? "תאריך" : "Date";
        document.getElementById("tab-style-label").textContent = he ? "סגנון" : "Style";
      }

      function updateLinks() {
        const q = `?date=${encodeURIComponent(state.date)}&lang=${state.lang}`;
        document.getElementById("link-d1").href = `design1.html${q}`;
        document.getElementById("link-d2").href = `design2.html${q}`;
        document.getElementById("link-d3").href = `design3.html${q}`;
        document.getElementById("link-classic").href = `index.html${q}`;
      }

      function populateDateSheet() {
        const dateContainer = document.getElementById("date-list-buttons");
        dateContainer.innerHTML = feed.dates.map(d => `
          <button type="button" class="pill-btn ${d === state.date ? "active" : ""}" style="justify-content:center;padding:10px;font-size:0.9rem;" onclick="changeDate('${d}')">
            ${d} ${d === feed.dates[0] ? "✨ (Latest)" : ""}
          </button>
        `).join("");
      }

      window.changeDate = function(newDate) {
        state.date = newDate;
        document.getElementById("date-sheet").classList.remove("open");
        render();
      };

      function render() {
        const d = feed.digests[state.date];
        const he = state.lang === "he";
        document.documentElement.lang = he ? "he" : "en";
        document.documentElement.dir = he ? "rtl" : "ltr";

        updateLinks();
        populateDateSheet();

        if (!d) {
          mainEl.innerHTML = "<p>No digest loaded for this date.</p>";
          return;
        }

        const allItems = d.items || [];
        updateCategoryCounts(allItems);

        document.getElementById("ui-brand-title").textContent = he ? "סקירת ביטחון" : "Defense Brief";
        document.getElementById("ui-brand-sub").textContent = he
          ? `מהדורת ${d.date} · ${allItems.length} דיווחים מרכזיים`
          : `Edition ${d.date} · ${allItems.length} key developments`;

        // Update BLUF sheet content
        const bluf = (d.digest && d.digest.bluf && d.digest.bluf[state.lang]) || [];
        document.getElementById("sheet-bluf-title").textContent = he ? "תקציר מנהלים (BLUF)" : "Executive Briefing (BLUF)";
        document.getElementById("bluf-sheet-content").innerHTML = bluf.map(b => `<li>${esc(b)}</li>`).join("");

        const domLabels = he
          ? { air: "הגנה אווירית", aerial: "אווירי", strike: "תקיפה", naval: "ימי" }
          : { air: "Air Defense", aerial: "Aerial", strike: "Strike", naval: "Naval" };

        let filtered = allItems;
        if (state.filter !== "all") {
          filtered = allItems.filter(i => i.domain === state.filter);
        }

        let html = `
          <div class="design-banner">
            <div><strong>Design 2: Bottom Navigation Bar</strong> — Thumb-accessible controls at screen bottom:</div>
            <div class="design-banner-links">
              <a href="design1.html?date=${encodeURIComponent(state.date)}&lang=${state.lang}" class="design-tag">1: 2-Tier</a>
              <span class="design-tag current">2: Bottom Bar</span>
              <a href="design3.html?date=${encodeURIComponent(state.date)}&lang=${state.lang}" class="design-tag">3: Capsule</a>
              <a href="index.html?date=${encodeURIComponent(state.date)}&lang=${state.lang}" class="design-tag">Classic</a>
            </div>
          </div>
        `;

        // Top Stories Carousel (Spotlight)
        const highItems = allItems.filter(i => i.priority === "high");
        const photos = d.photos || {};

        if (state.filter === "all" && highItems.length > 0) {
          const carouselSlides = highItems.slice(0, 6).map((it) => {
            const pinfo = photos[it.id];
            const primarySrc = pinfo ? (pinfo.local_src || pinfo.url) : "";
            const remoteUrl = pinfo ? (pinfo.url || "") : "";
            const fallbackJs = (remoteUrl && primarySrc !== remoteUrl)
              ? `if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${esc(remoteUrl)}';}else{this.style.display='none';}`
              : `this.style.display='none';`;

            return `
              <article class="carousel-slide" onclick="document.getElementById('story-${it.id}').scrollIntoView({behavior:'smooth',block:'center'});">
                <div class="carousel-img-wrap">
                  ${primarySrc ? `<img src="${esc(primarySrc)}" alt="${esc(it.h[state.lang])}" loading="lazy" referrerpolicy="no-referrer" onerror="${fallbackJs}" />` : ""}
                  <span class="carousel-tag">${he ? "עדיפות" : "High Priority"}</span>
                </div>
                <div class="carousel-content">
                  <div class="carousel-tags">
                    <span>${esc(domLabels[it.domain])}</span> · <span>${esc(he ? it.countryHe : it.country)}</span>
                  </div>
                  <h3 class="carousel-title">${esc(it.h[state.lang])}</h3>
                  <p class="carousel-desc">${esc(it.what[state.lang])}</p>
                </div>
              </article>
            `;
          }).join("");

          html += `
            <section class="carousel-section" id="section-top-stories">
              <h2 class="carousel-heading">🔥 ${he ? "כותרות עדיפות ראשונה" : "Top Developments"}</h2>
              <div class="carousel-track">
                ${carouselSlides}
              </div>
            </section>
          `;
        }

        // Feed List
        html += `<section class="feed-section"><div class="feed-grid">`;

        filtered.forEach((it) => {
          const pinfo = photos[it.id];
          const hasPhoto = Boolean(pinfo && (pinfo.url || pinfo.local_src));
          const isHigh = it.priority === "high";

          let mediaHtml = "";
          if (hasPhoto) {
            const primarySrc = pinfo.local_src || pinfo.url;
            const remoteUrl = pinfo.url || "";
            const cred = he ? (pinfo.credit_he || pinfo.credit_en) : pinfo.credit_en;
            const fallbackJs = (remoteUrl && primarySrc !== remoteUrl)
              ? `if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${esc(remoteUrl)}';}else{const mb=this.closest('.story-media-box');if(mb)mb.style.display='none';}`
              : `const mb=this.closest('.story-media-box');if(mb)mb.style.display='none';`;

            mediaHtml = `
              <div class="story-media-box">
                <img src="${esc(primarySrc)}" alt="${esc(it.h[state.lang])}" loading="lazy" referrerpolicy="no-referrer" onerror="${fallbackJs}" />
                <div class="media-caption">
                  <span>${esc(cred)}</span>
                  <a href="${esc(remoteUrl || primarySrc)}" target="_blank" rel="noopener">${he ? "מקור תמונה" : "Photo Source"}</a>
                </div>
              </div>
            `;
          }

          const hasDeepSpecs = Boolean(it.figs || it.why || it.israel);
          let specsHtml = "";
          if (hasDeepSpecs) {
            specsHtml = `
              <details class="specs-disclosure">
                <summary class="specs-summary">
                  <span>${he ? "🔍 ניתוח מעמיק והשלכות לישראל" : "🔍 Deep Dive & Strategic Implications"}</span>
                  <span class="specs-chevron">▼</span>
                </summary>
                <div class="specs-body">
                  ${it.figs ? `
                    <div class="spec-block">
                      <span class="spec-label">${he ? "נתונים טכניים מרכזיים:" : "Key Specs & Figures:"}</span>
                      <span>${esc(it.figs[state.lang])}</span>
                    </div>
                  ` : ""}
                  ${it.why ? `
                    <div class="spec-block">
                      <span class="spec-label">${he ? "למה זה משמעותי:" : "Why It Matters:"}</span>
                      <span>${esc(it.why[state.lang])}</span>
                    </div>
                  ` : ""}
                  ${it.israel ? `
                    <div class="spec-block">
                      <span class="spec-label" style="color:var(--accent);">${he ? "משמעויות לישראל ולמזה\"ת:" : "Israel & Regional Implications:"}</span>
                      <span>${esc(it.israel[state.lang])}</span>
                    </div>
                  ` : ""}
                </div>
              </details>
            `;
          }

          const srcLinks = (it.src || [])
            .map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`)
            .join(" · ");

          html += `
            <article class="story-card ${isHigh ? "high-priority" : ""}" id="story-${it.id}" data-id="${it.id}">
              <div class="story-top-meta">
                <div class="meta-pills">
                  <span class="mini-badge">${esc(hid(it.id, he))}</span>
                  <span class="mini-badge domain">${esc(domLabels[it.domain])}</span>
                  <span class="mini-badge">${esc(he ? it.countryHe : it.country)}</span>
                  ${isHigh ? `<span class="mini-badge priority-high">${he ? "עדיפות" : "HIGH PRIORITY"}</span>` : ""}
                </div>
                <button type="button" class="story-share-btn" onclick="shareStory('${it.id}', this)" data-id="${it.id}" title="${he ? 'שתף' : 'Share'}">
                  <span class="share-icon">↗</span> <span class="share-text">${he ? "שתף" : "Share"}</span>
                </button>
              </div>

              <h3 class="story-title">${esc(it.h[state.lang])}</h3>

              ${mediaHtml}

              <p class="story-lead">${esc(it.what[state.lang])}</p>

              ${specsHtml}

              <div class="story-sources">
                <strong>${he ? "מקורות: " : "Sources: "}</strong>${srcLinks}
              </div>
            </article>
          `;
        });

        html += `</div></section>`;
        mainEl.innerHTML = html;
      }

      // Bottom Nav Button Handlers
      document.getElementById("tab-feed").addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      document.getElementById("tab-top").addEventListener("click", () => {
        const topEl = document.getElementById("section-top-stories");
        if (topEl) {
          topEl.scrollIntoView({ behavior: "smooth", block: "start" });
        } else {
          showToast(state.lang === "he" ? "הצג את כל הידיעות לראות את המובילות" : "Showing all stories includes top");
        }
      });

      document.getElementById("tab-bluf").addEventListener("click", () => {
        document.getElementById("bluf-sheet").classList.add("open");
      });
      document.getElementById("close-bluf-sheet").addEventListener("click", () => {
        document.getElementById("bluf-sheet").classList.remove("open");
      });

      document.getElementById("tab-date").addEventListener("click", () => {
        document.getElementById("date-sheet").classList.add("open");
      });
      document.getElementById("close-date-sheet").addEventListener("click", () => {
        document.getElementById("date-sheet").classList.remove("open");
      });

      document.getElementById("tab-style").addEventListener("click", () => {
        document.getElementById("style-sheet").classList.add("open");
      });
      document.getElementById("close-style-sheet").addEventListener("click", () => {
        document.getElementById("style-sheet").classList.remove("open");
      });

      // Quick Language Toggle
      document.getElementById("tab-lang").addEventListener("click", () => {
        state.lang = state.lang === "en" ? "he" : "en";
        render();
      });

      // Category Pill handlers
      document.querySelectorAll(".pill-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".pill-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.filter = btn.getAttribute("data-domain");
          render();
        });
      });

      // Close sheets on backdrop click
      document.querySelectorAll(".sheet-backdrop").forEach((sheet) => {
        sheet.addEventListener("click", (e) => {
          if (e.target === sheet) sheet.classList.remove("open");
        });
      });

      function scrollToHashTarget() {
        const hash = window.location.hash;
        if (!hash) return;
        const targetRaw = hash.replace(/^#/, "");
        if (!targetRaw) return;

        let el = document.getElementById(targetRaw);
        if (!el) {
          const clean = targetRaw.replace(/^(story-|item-)/, "");
          el = document.getElementById("story-" + clean) ||
               document.getElementById("item-" + clean) ||
               document.querySelector(`[data-id="${clean}"]`);
        }

        if (el) {
          setTimeout(() => {
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            el.classList.add("highlight-target");
            setTimeout(() => {
              el.classList.remove("highlight-target");
            }, 2500);
          }, 150);
        }
      }

      render();
      if (window.location.hash) {
        setTimeout(scrollToHashTarget, 100);
      }
      window.addEventListener("hashchange", scrollToHashTarget);
    })();
  </script>
</body>
</html>
